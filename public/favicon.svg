<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161c1b"/>
      <stop offset="1" stop-color="#0b0e0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.58" r="0.6">
      <stop offset="0" stop-color="#e87843" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#e87843" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a63"/>
      <stop offset="1" stop-color="#d96a3c"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="64" height="64" rx="8" fill="url(#bg)"/>
  <rect width="64" height="64" rx="8" fill="url(#glow)"/>

  <!-- precision frame (TS logo box jaisa) -->
  <rect x="3.5" y="3.5" width="57" height="57" fill="none" stroke="#f5f0e8" stroke-opacity="0.16" stroke-width="1"/>

  <!-- crown + side pusher -->
  <rect x="29" y="6" width="6" height="5" rx="1.2" fill="url(#crown)"/>
  <rect x="30.5" y="10.5" width="3" height="4" fill="#e87843"/>
  <line x1="44.5" y1="24.5" x2="48" y2="21" stroke="#e87843" stroke-width="3.4" stroke-linecap="round"/>

  <!-- watch face -->
  <circle cx="32" cy="38" r="17" fill="#121615" stroke="#f5f0e8" stroke-opacity="0.9" stroke-width="1.8"/>
  <circle cx="32" cy="38" r="13.5" fill="none" stroke="#f5f0e8" stroke-opacity="0.14" stroke-width="0.8"/>

  <!-- main ticks (12/3/6/9) -->
  <g stroke="#f5f0e8" stroke-width="1.6" stroke-linecap="round">
    <line x1="32" y1="24.5" x2="32" y2="27.5"/>
    <line x1="45.5" y1="38" x2="42.5" y2="38"/>
    <line x1="32" y1="51.5" x2="32" y2="48.5"/>
    <line x1="18.5" y1="38" x2="21.5" y2="38"/>
  </g>

  <!-- minor ticks -->
  <g stroke="#f5f0e8" stroke-opacity="0.35" stroke-width="1.1" stroke-linecap="round">
    <line x1="41.5" y1="28.5" x2="39.5" y2="30.5"/>
    <line x1="41.5" y1="47.5" x2="39.5" y2="45.5"/>
    <line x1="22.5" y1="47.5" x2="24.5" y2="45.5"/>
    <line x1="22.5" y1="28.5" x2="24.5" y2="30.5"/>
  </g>

  <!-- hands -->
  <line x1="32" y1="38" x2="32" y2="27.5" stroke="#f5f0e8" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="26.5" y1="43.5" x2="40" y2="30" stroke="#e87843" stroke-width="1.8" stroke-linecap="round"/>

  <!-- glowing center dot (header wali dot jaisa) -->
  <circle cx="32" cy="38" r="2.4" fill="#e87843"/>
  <circle cx="32" cy="38" r="0.9" fill="#101313"/>
</svg>